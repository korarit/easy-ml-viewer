[project]
name = "easy-ml-viewer-backend"
version = "1.0.0"
description = "Easy ML Viewer Backend — DDD Shared Core (Phase 03)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "psutil>=6.0.0",
  "python-multipart>=0.0.12",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=17.0.0",
  "openpyxl>=3.1.5",
  "charset-normalizer>=3.3.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.0.0",
  "msgpack>=1.0",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
